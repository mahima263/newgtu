</div>
</div>
</section>
<script>
(function(){
  /* Zoho posts "<perma>|<height>" when the form height changes */
  var ifr=document.getElementById('zoho-talk');
  window.addEventListener('message',function(e){
    if(typeof e.data!=='string') return; var d=e.data.split('|'); if(d.length<2) return;
    var h=parseInt(d[1],10); if(h) ifr.style.height=(h+40)+'px';
  });
  /* parallax for the campus background (desktop only; reduced-motion respected) */
  var bg=document.querySelector('.contact-form__bg');
  if(bg && window.matchMedia('(min-width: 992px) and (prefers-reduced-motion: no-preference)').matches){
    var sec=bg.parentElement, ticking=false;
    function move(){ var r=sec.getBoundingClientRect(); bg.style.transform='translate3d(0,'+(-r.top*0.25)+'px,0)'; ticking=false; }
    window.addEventListener('scroll',function(){ if(!ticking){ requestAnimationFrame(move); ticking=true; } },{passive:true});
    move();
  }
})();
</script>
